<div class="dashboard">
    <div class="stat-grid">
        @for (stat of stats; track stat.title) {
            <div class="stat-card">
                <app-icon [name]="stat.icon" [size]="28" class="stat-icon" />
                <h5 class="stat-title">{{ stat.title }}</h5>
                <h3 class="stat-value">{{ stat.value }}</h3>
            </div>
        }
    </div>
</div>
