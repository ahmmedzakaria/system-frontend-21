<div class="page-header">
    <h2>Client Applications</h2>
    <div class="header-actions">
        <app-button label="Authentication Policies" icon="key" variant="ghost" (clicked)="configureAuthPolicies()" />
        <app-button *appAuthorizedUi="'client-applications.create'" label="New Client Application" icon="plus" variant="primary" (clicked)="create()" />
    </div>
</div>

<app-dynamic-list
        [columns]="columns"
        [loadItems]="loadItems"
        [pageSize]="10"
        searchPlaceholder="Search by client code or name…"
        emptyTitle="No client applications yet"
        emptyMessage="Register the first client application to get started."
        (rowClick)="router.navigate(['/access-control/client-applications', $event.id])"
/>
